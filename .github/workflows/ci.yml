name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Keyed on the branch rather than the ref, so the push run and the
  # pull_request run for the same branch share a group and the redundant one is
  # cancelled instead of doubling every PR's CI.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e '.[dev,web,url,eval]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: End-to-end CLI run
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tests")
          import fixtures as fx
          fx.write_wav("fixture.wav", fx.render_progression(fx.POP_LOOP_C, 2.0, 3))
          EOF
          cka analyze fixture.wav
          cka analyze fixture.wav --json result.json --lab result.lab --quiet
          python - <<'EOF'
          import json
          result = json.load(open("result.json"))
          assert result["schema"] == 1, result["schema"]
          assert (result["key"]["tonic"], result["key"]["mode"]) == ("C", "major"), result["key"]
          assert result["progression"]["main_loop"]["roman"] == ["I", "V", "vi", "IV"], result
          labels = [c["label"] for c in result["chords"]]
          assert labels[:4] == ["C:maj", "G:maj", "A:min", "F:maj"], labels
          print("end-to-end OK:", result["key"]["tonic"], result["key"]["mode"])
          EOF
          head -3 result.lab

      - name: End-to-end accuracy evaluation
        run: |
          # Ground truth is written here by hand, not taken from the analyzer's
          # own output — a reference derived from the thing under test would
          # score 1.0 by construction and measure nothing.
          mkdir -p dataset
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tests")
          import fixtures as fx

          fx.write_wav("dataset/pop.wav", fx.render_progression(fx.POP_LOOP_C, 2.0, 3))

          lines, time = [], 0.0
          for _ in range(3):
              for label in ["C:maj", "G:maj", "A:min", "F:maj"]:
                  lines.append(f"{time:.6f}\t{time + 2.0:.6f}\t{label}")
                  time += 2.0
          open("dataset/pop.lab", "w").write("\n".join(lines) + "\n")
          open("dataset/pop.key", "w").write("C major\n")
          EOF
          cka eval dataset --json eval.json --quiet
          python - <<'EOF'
          import json
          summary = json.load(open("eval.json"))["summary"]
          assert summary["scored"] == 1, summary
          assert summary["failed"] == 0, summary
          assert summary["majmin"] >= 0.75, summary
          assert summary["key"] == 1.0, summary
          print("eval OK:", {k: summary[k] for k in ("root", "majmin", "mirex", "key")})
          EOF
