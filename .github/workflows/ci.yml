name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Keyed on the branch rather than the ref, so the push run and the
  # pull_request run for the same branch share a group and the redundant one is
  # cancelled instead of doubling every PR's CI.
  #
  # `ref_name`, not `ref`: on a push `github.ref` is `refs/heads/topic` while
  # `head_ref` on the pull request is a bare `topic`, so the two events built
  # different keys and neither run ever cancelled the other. `ref_name` drops
  # the prefix, which is what makes the two halves match.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e '.[dev,web,url,eval]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: End-to-end CLI run
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tests")
          import fixtures as fx
          fx.write_wav("fixture.wav", fx.render_progression(fx.POP_LOOP_C, 2.0, 3))
          EOF
          cka analyze fixture.wav
          cka analyze fixture.wav --json result.json --lab result.lab --quiet
          python - <<'EOF'
          import json
          result = json.load(open("result.json"))
          assert result["schema"] == 1, result["schema"]
          assert (result["key"]["tonic"], result["key"]["mode"]) == ("C", "major"), result["key"]
          assert result["progression"]["main_loop"]["roman"] == ["I", "V", "vi", "IV"], result
          labels = [c["label"] for c in result["chords"]]
          assert labels[:4] == ["C:maj", "G:maj", "A:min", "F:maj"], labels
          print("end-to-end OK:", result["key"]["tonic"], result["key"]["mode"])
          EOF
          head -3 result.lab

      - name: End-to-end accuracy evaluation
        run: |
          # Ground truth is written here by hand, not taken from the analyzer's
          # own output — a reference derived from the thing under test would
          # score 1.0 by construction and measure nothing.
          mkdir -p dataset
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tests")
          import fixtures as fx

          fx.write_wav("dataset/pop.wav", fx.render_progression(fx.POP_LOOP_C, 2.0, 3))

          lines, time = [], 0.0
          for _ in range(3):
              for label in ["C:maj", "G:maj", "A:min", "F:maj"]:
                  lines.append(f"{time:.6f}\t{time + 2.0:.6f}\t{label}")
                  time += 2.0
          open("dataset/pop.lab", "w").write("\n".join(lines) + "\n")
          open("dataset/pop.key", "w").write("C major\n")
          EOF
          cka eval dataset --json eval.json --quiet
          python - <<'EOF'
          import json
          summary = json.load(open("eval.json"))["summary"]
          assert summary["scored"] == 1, summary
          assert summary["failed"] == 0, summary
          assert summary["majmin"] >= 0.75, summary
          assert summary["key"] == 1.0, summary
          print("eval OK:", {k: summary[k] for k in ("root", "majmin", "mirex", "key")})
          EOF

  bare-install:
    # The core install has to stand on its own. This leg installs no extras, so
    # anything that quietly became a hard dependency shows up as a failure rather
    # than as a test that silently stopped running. One Python is enough:
    # whether an extra is absent does not vary by interpreter version.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install without any extras
        run: pip install -e '.[dev]'

      - name: Test
        # No -q here: pyproject already supplies it via addopts, and a second one
        # makes pytest quiet enough to drop the "N passed" line the next step
        # counts. `set -o pipefail` so a failing run is not masked by tee.
        run: |
          set -o pipefail
          pytest -rs | tee bare-run.txt

      - name: Check every skip is an extra we left out on purpose
        run: |
          python - <<'EOF'
          import re, sys

          report = open("bare-run.txt").read()

          # Every skip must name one of the extras this leg deliberately omits.
          # An unexplained skip means a test stopped running for some other
          # reason, which is exactly what this job exists to notice.
          allowed = re.compile(r"requires the \[(eval|web)\] extra|ffmpeg not installed")
          reasons = re.findall(r"^SKIPPED \[\d+\] (.+)$", report, re.MULTILINE)
          unexplained = [r for r in reasons if not allowed.search(r)]
          assert not unexplained, f"unexplained skips: {unexplained}"

          # And both extras must still be skipping *something*. If mir_eval or
          # FastAPI became a core dependency, these modules would start running
          # here and the corresponding skip would vanish.
          for extra in ("eval", "web"):
              assert any(f"[{extra}] extra" in r for r in reasons), (
                  f"nothing skipped for the [{extra}] extra — has it become a core dependency?"
              )

          # A floor, not an exact count: tests get added, and pinning the total
          # would turn every new test into a CI failure here.
          passed = int(re.search(r"(\d+) passed", report).group(1))
          assert passed >= 150, f"only {passed} tests ran without the extras"
          print(f"bare install OK: {passed} passed, {len(reasons)} skipped")
          EOF

      - name: Each optional feature explains how to install itself
        run: |
          # Offline by construction: `cka eval` checks the extra before it walks
          # the dataset, `cka web` before it binds, and download_url imports
          # yt_dlp before any network call. example.invalid is reserved by
          # RFC 2606 and cannot resolve even if that order ever changed.
          set +e
          cka eval . > eval-hint.txt 2>&1
          test $? -ne 0 || { echo "cka eval should have failed"; exit 1; }
          cka web --no-browser > web-hint.txt 2>&1
          test $? -ne 0 || { echo "cka web should have failed"; exit 1; }
          cka analyze 'https://example.invalid/song' > url-hint.txt 2>&1
          test $? -ne 0 || { echo "cka analyze should have failed"; exit 1; }
          set -e
          grep -F 'chord-key-analyzer[eval]' eval-hint.txt
          grep -F 'chord-key-analyzer[web]' web-hint.txt
          grep -F 'chord-key-analyzer[url]' url-hint.txt
          # `grep -l` exits 0 only when it finds one, which is the failure we are
          # looking for. (`grep -L` lists the *clean* files but still exits 1 when
          # nothing matched, so under `set -e` it fails exactly when it passes.)
          if grep -l Traceback eval-hint.txt web-hint.txt url-hint.txt; then
            echo "a missing extra printed a traceback instead of its install hint"
            exit 1
          fi
          echo "install hints OK"
