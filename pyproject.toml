[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chord-key-analyzer"
version = "0.2.0"
description = "Offline key, chord and progression analysis for audio files and URLs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "chord-key-analyzer contributors" }]
keywords = ["music", "chords", "key-detection", "mir", "audio", "dsp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
url = ["yt-dlp>=2024.1.1"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
# Reserved for a future local neural chord backend (see docs/PLAN.md). Empty in v1.
deep = []
# `cka eval`: mir_eval is the reference implementation of the MIREX metrics.
# It needs only numpy and scipy, both already present via librosa.
eval = ["mir_eval>=0.7"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
cka = "chord_key_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/slittycode/chord-key-analyzer"
Source = "https://github.com/slittycode/chord-key-analyzer"

[tool.hatch.build.targets.wheel]
packages = ["src/chord_key_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
